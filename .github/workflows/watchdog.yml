name: Nexora-India Watchdog (Telegram report + supplier auto-sync)
on:
  schedule:
    - cron: "30 3,15 * * *"   # 09:00 & 21:00 IST
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Call watchdog (report + optional supplier sync)
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://nexora-india.pages.dev');
            const response = await fetch('https://nexora-india.pages.dev/api/watchdog', {
              method: 'POST',
              headers: { Authorization: `Bearer ${token}` }
            });
            const body = await response.text();
            console.log(`HTTP ${response.status}`);
            console.log(body);
            if (response.status !== 200) {
              core.setFailed(`Watchdog returned HTTP ${response.status}`);
            }
