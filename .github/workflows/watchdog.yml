name: Nexora-India Watchdog (Telegram report + supplier auto-sync)
on:
  schedule:
    - cron: "30 3,15 * * *"   # 09:00 & 21:00 IST
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - name: Call watchdog (report + optional supplier sync)
        run: |
          set -e
          token=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://nexora-india.pages.dev" | python -c 'import sys,json; print(json.load(sys.stdin)["value"])')
          code=$(curl -sS -o /tmp/wd.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $token" \
            "https://nexora-india.pages.dev/api/watchdog")
          echo "HTTP $code"
          cat /tmp/wd.json
          echo
          test "$code" = "200"
