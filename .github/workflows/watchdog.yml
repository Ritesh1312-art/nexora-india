name: Nexora-India Watchdog (Telegram report + supplier auto-sync)
on:
  schedule:
    - cron: "30 3,15 * * *"   # 09:00 & 21:00 IST
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call watchdog (report + optional supplier sync)
        run: |
          set -e
          code=$(curl -sS -o /tmp/wd.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.WATCHDOG_SECRET }}" \
            "https://nexora-india.pages.dev/api/watchdog")
          echo "HTTP $code"
          cat /tmp/wd.json
          echo
          test "$code" = "200"
