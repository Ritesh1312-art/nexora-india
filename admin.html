<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111936"><title>Nexora-India Admin</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23111936'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Arial' font-size='34' font-weight='900' fill='white'%3EN%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="/admin-v2.css?v=20260817-10"></head><body><main class="admin-shell"><div id="login" class="panel login"><h1>Admin Login</h1><p class="muted">Nexora-India operations console</p><form id="loginForm" novalidate><label>Admin password<input id="password" class="input" type="password" autocomplete="current-password" required></label><button id="loginBtn" class="btn" type="submit">Login</button><div id="msg" aria-live="polite"></div></form></div><div id="dash" hidden></div></main><script>
(function(){
  const form=document.getElementById('loginForm');
  const password=document.getElementById('password');
  const button=document.getElementById('loginBtn');
  const msg=document.getElementById('msg');
  form.addEventListener('submit',async function(e){
    e.preventDefault();
    const pw=password.value;
    if(!pw){msg.innerHTML='<div class="notice error">Enter admin password</div>';return;}
    button.disabled=true;button.textContent='Logging in…';msg.innerHTML='';
    try{
      const r=await fetch('/api/admin',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({action:'login',password:pw}),cache:'no-store'});
      const d=await r.json().catch(()=>({error:'Server returned an invalid response'}));
      if(!r.ok)throw new Error(d.error||('Login failed (HTTP '+r.status+')'));
      if(!d.ok)throw new Error(d.error||'Login failed');
      window.location.replace('/admin.html?session=1');
    }catch(err){
      msg.innerHTML='<div class="notice error">'+String(err.message||err).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))+'</div>';
      button.disabled=false;button.textContent='Login';
    }
  });
})();
</script><script src="/admin-v3.js?v=20260817-2"></script></body></html>
