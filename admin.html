<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111936">
<title>Nexora-India Admin</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23111936'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Arial' font-size='34' font-weight='900' fill='white'%3EN%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/admin-v2.css?v=20260819-8">
</head>
<body>
<main class="admin-shell">
  <div id="login" class="panel login">
    <h1>Admin Login</h1>
    <p class="muted">Nexora-India operations console</p>
    <form id="loginForm" novalidate>
      <label>Admin password
        <input id="password" class="input" type="password" autocomplete="current-password" required>
      </label>
      <button id="loginBtn" class="btn" type="submit">Login</button>
      <div id="msg" aria-live="polite"></div>
    </form>
  </div>
  <div id="dash" hidden></div>
</main>
<script src="/admin-v2.js?v=20260819-8"></script>
<script>
(function(){
  'use strict';
  const form=document.getElementById('loginForm');
  const password=document.getElementById('password');
  const button=document.getElementById('loginBtn');
  const msg=document.getElementById('msg');
  if(!form||!password||!button)return;
  let busy=false;
  document.addEventListener('submit',async function(e){
    if(e.target!==form)return;
    e.preventDefault();
    e.stopImmediatePropagation();
    if(busy)return;
    const value=password.value;
    if(!value){if(msg)msg.innerHTML='<div class="notice error">Enter admin password</div>';password.focus();return;}
    busy=true;
    button.disabled=true;
    button.textContent='Logging in…';
    if(msg)msg.innerHTML='';
    try{
      const r=await fetch('/api/admin',{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'content-type':'application/json'},body:JSON.stringify({action:'login',password:value})});
      const d=await r.json().catch(()=>({error:'Invalid server response'}));
      if(!r.ok||!d.ok)throw new Error(d.error||'Login failed');
      const s=await fetch('/api/admin',{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'content-type':'application/json'},body:JSON.stringify({action:'session'})});
      const sd=await s.json().catch(()=>({error:'Invalid session response'}));
      if(!s.ok||!sd.ok)throw new Error(sd.error||'Admin session could not be established');
      button.textContent='Login successful…';
      window.location.reload();
    }catch(err){
      if(msg)msg.innerHTML='<div class="notice error">'+String(err.message||err).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))+'</div>';
      busy=false;
      button.disabled=false;
      button.textContent='Login';
      password.focus();
    }
  },true);
})();
</script>
</body>
</html>
