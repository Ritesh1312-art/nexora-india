<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111936">
<title>Nexora-India Admin</title>
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="/images/favicon.png">
<link rel="apple-touch-icon" href="/images/favicon.png">
<link rel="stylesheet" href="/admin-v2.css?v=20260822-1">
</head>
<body>
<main class="admin-shell">
  <div id="login" class="panel login">
    <div class="login-logo" aria-hidden="true">N</div>
    <h1>Admin Login</h1>
    <p class="muted">Nexora-India operations console</p>
    <form id="loginForm" novalidate>
      <label>Admin password
        <input id="password" class="input" type="password" autocomplete="current-password" required>
      </label>
      <button id="loginBtn" class="btn" type="submit">Login</button>
      <div id="msg" aria-live="polite"></div>
    </form>
  </div>
  <div id="dash" hidden></div>
</main>
<script src="/admin-boot.js?v=20260822-1"></script>
<script src="/admin-v2.js?v=20260822-1"></script>
</body>
</html>
