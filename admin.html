<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111936">
<title>Nexora-India Admin</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23111936'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Arial' font-size='34' font-weight='900' fill='white'%3EN%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/admin-v2.css?v=20260818-2">
</head>
<body>
<main class="admin-shell">
  <div id="login" class="panel login">
    <h1>Admin Login</h1>
    <p class="muted">Nexora-India operations console</p>
    <form id="loginForm" novalidate>
      <label>Admin password
        <input id="password" class="input" type="password" autocomplete="current-password" required>
      </label>
      <button id="loginBtn" class="btn" type="submit">Login</button>
      <div id="msg" aria-live="polite"></div>
    </form>
  </div>
  <div id="dash" hidden></div>
</main>
<script src="/admin-v3.js?v=20260818-5"></script>
<script>
(function(){
  'use strict';
  const form=document.getElementById('loginForm');
  const password=document.getElementById('password');
  const button=document.getElementById('loginBtn');
  const msg=document.getElementById('msg');
  if(!form||!password||!button||!msg)return;
  async function doLogin(e){
    if(e)e.preventDefault();
    const pw=password.value;
    if(!pw){msg.innerHTML='<div class="notice error">Enter admin password</div>';password.focus();return false;}
    button.disabled=true;
    button.textContent='Logging in…';
    msg.innerHTML='';
    try{
      const r=await fetch('/api/admin',{
        method:'POST',
        credentials:'same-origin',
        cache:'no-store',
        headers:{'content-type':'application/json','cache-control':'no-cache'},
        body:JSON.stringify({action:'login',password:pw})
      });
      const text=await r.text();
      let d={};
      try{d=JSON.parse(text||'{}')}catch{d={error:'Server returned an invalid response'}}
      if(!r.ok||!d.ok)throw new Error(d.error||('Login failed (HTTP '+r.status+')'));
      button.textContent='Login successful…';
      window.location.replace('/admin.html?session=1');
    }catch(err){
      msg.innerHTML='<div class="notice error">'+String(err.message||err).replace(/[&<>\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]})+'</div>';
      button.disabled=false;
      button.textContent='Login';
      password.focus();
    }
    return false;
  }
  form.addEventListener('submit',doLogin);
  button.onclick=doLogin;
  password.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();doLogin(e);}});
})();
</script>
</body>
</html>
