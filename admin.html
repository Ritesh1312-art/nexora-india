<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>Nexora-India Admin</title>
<link rel="stylesheet" href="/styles.css">
<style>
.admin-wrap{max-width:1100px;margin:auto;padding:20px 16px}.hide{display:none!important}.login{max-width:460px;margin:45px auto}.muted2{color:#687184;font-size:13px}.table td,.table th{white-space:nowrap}.actions{display:flex;gap:6px;flex-wrap:wrap}.tabs{display:flex;gap:8px;overflow:auto;margin:15px 0}.tabs button{white-space:nowrap}.tabs button.active{background:#111827;color:#fff}.product-thumb{width:54px;height:54px;object-fit:cover;border-radius:8px;border:1px solid #e5e7eb;background:#f3f4f6}.price-note{font-size:12px;color:#687184;margin-top:3px}.debug{white-space:pre-wrap;overflow:auto;background:#111827;color:#f9fafb;border-radius:8px;padding:12px;font-size:12px;margin-top:10px}
</style>
</head>
<body>
<header class="topbar"><a class="brand" href="/"><span class="brand-mark">N</span><span>Nexora-India</span></a><nav><a href="/">Store</a><button id="logout" class="ghost hide">Logout</button></nav></header>
<main class="admin-wrap">
<div id="login" class="panel login"><h2>Admin Login</h2><div class="field"><label>Admin password</label><input id="password" class="input" type="password" autocomplete="current-password"></div><button id="loginBtn" class="btn">Login</button><div id="loginMsg"></div></div>
<div id="dash" class="hide">
<h2>Nexora-India Admin</h2><div id="stats" class="admin-grid"></div>
<div class="tabs">
<button data-tab="products" class="btn" onclick="tab('products')">Products</button>
<button data-tab="orders" class="btn secondary" onclick="tab('orders')">Orders</button>
<button data-tab="users" class="btn secondary" onclick="tab('users')">Users</button>
<button data-tab="offers" class="btn secondary" onclick="tab('offers')">Offers</button>
<button data-tab="cj" class="btn secondary" onclick="syncCJ()">CJ Sync</button>
<button data-tab="deodap" class="btn secondary" onclick="syncDeoDap()">DeoDap Sync</button>
</div>
<div id="content"></div>
</div></main>
<script>
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
function errText(e){return e?.message||'Request failed'}
async function api(body){const r=await fetch('/api/admin',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({error:'Invalid server response'}));if(!r.ok){let msg=d.error||'Request failed';if(d.details)msg+=' — '+JSON.stringify(d.details);throw new Error(msg)}return d}
function setActiveTab(name){$$('[data-tab]').forEach(b=>{const active=b.dataset.tab===name;b.classList.toggle('active',active);b.classList.toggle('secondary',!active);if(active)b.classList.add('btn');});window.activeTab=name}
async function login(){try{await api({action:'login',password:$('#password').value});$('#login').classList.add('hide');$('#dash').classList.remove('hide');$('#logout').classList.remove('hide');await load(true);}catch(e){$('#loginMsg').innerHTML='<div class="notice error">'+esc(errText(e))+'</div>'}}
$('#loginBtn').onclick=login;$('#password').onkeydown=e=>{if(e.key==='Enter')login()};
async function load(first=false){try{const [s,p,o,u,f]=await Promise.all([api({action:'stats'}),api({action:'products'}),api({action:'orders'}),api({action:'users'}),api({action:'offers'})]);window.D={p:p||[],o:o||[],u:u||[],f:f||[]};$('#stats').innerHTML=`<div class="stat"><span>Products</span><b>${s.products}</b></div><div class="stat"><span>Users</span><b>${s.users}</b></div><div class="stat"><span>Orders</span><b>${s.orders}</b></div><div class="stat"><span>Sales</span><b>${money(s.sales)}</b></div>`;tab(first?'products':(window.activeTab||'products'));}catch(e){$('#content').innerHTML='<div class="notice error">'+esc(errText(e))+'</div>'}}
window.tab=function(t){setActiveTab(t);const d=window.D||{};if(t==='products'){$('#content').innerHTML=`<div class="panel"><h3>Products</h3><div class="table-wrap"><table class="table"><tr><th>Image</th><th>Name</th><th>Source</th><th>Supplier Cost</th><th>Suggested / Max Sale</th><th>Price</th><th>Stock</th><th>Live</th><th>Action</th></tr>${d.p.map(p=>`<tr><td><img class="product-thumb" src="${esc(p.image_url||'https://placehold.co/100x100?text=No+Image')}" alt=""></td><td>${esc(p.name)}</td><td>${esc(p.source)}</td><td>${money(p.cost_price)}</td><td>${money(p.suggested_price)}<div class="price-note">Recommended sale ceiling</div></td><td>${money(p.selling_price)}</td><td>${p.stock}</td><td>${p.active&&p.approved_by_admin?'Yes':'No'}</td><td><button class="btn" onclick="editProduct('${p.id}')">Edit</button></td></tr>`).join('')}</table></div><div id="editor"></div></div>`}else if(t==='orders'){$('#content').innerHTML=`<div class="panel"><h3>Orders</h3><div class="table-wrap"><table class="table"><tr><th>Order</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th><th>Action</th></tr>${d.o.map(o=>`<tr><td>${esc(o.order_number)}</td><td>${esc(o.customer_name)}<br>${esc(o.customer_phone)}</td><td>${money(o.total_amount)}</td><td>${esc(o.payment_status)}<br>${esc(o.utr||'')}</td><td>${esc(o.order_status)}</td><td><button class="btn" onclick="verify('${o.id}')">Verify</button></td></tr>`).join('')}</table></div></div>`}else if(t==='users'){$('#content').innerHTML=`<div class="panel"><h3>Users</h3><div class="table-wrap"><table class="table"><tr><th>User ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Joined</th></tr>${d.u.map(u=>`<tr><td>${esc(u.user_id)}</td><td>${esc(u.full_name)}</td><td>${esc(u.email)}</td><td>${esc(u.phone)}</td><td>${esc(new Date(u.created_at).toLocaleString())}</td></tr>`).join('')}</table></div></div>`}else{$('#content').innerHTML=`<div class="panel"><h3>Offers</h3><p>Existing offers: ${d.f.length}</p><div class="field"><label>Offer name</label><input id="oname" class="input"></div><div class="field"><label>Code</label><input id="ocode" class="input"></div><div class="field"><label>Discount %</label><input id="odisc" class="input" type="number"></div><button class="btn" onclick="createOffer()">Create offer</button></div>`}}
window.editProduct=function(id){const p=D.p.find(x=>x.id===id);$('#editor').innerHTML=`<div class="panel"><h3>Edit ${esc(p.name)}</h3><div class="field"><label>Final selling price</label><input id="price" class="input" type="number" value="${p.selling_price}"></div><div class="field"><label>Stock</label><input id="stock" class="input" type="number" value="${p.stock}"></div><label><input id="live" type="checkbox" ${p.active&&p.approved_by_admin?'checked':''}> Publish live</label><br><button class="btn" style="margin-top:10px" onclick="saveProduct('${id}')">Save</button></div>`};
window.saveProduct=async id=>{try{await api({action:'update_product',id,price:Number($('#price').value),stock:Number($('#stock').value),active:$('#live').checked,approved_by_admin:$('#live').checked});await load()}catch(e){alert(errText(e))}};
window.verify=async id=>{const s=prompt('Payment status: VERIFIED or REJECTED','VERIFIED');if(!s)return;try{await api({action:'verify_payment',order_id:id,status:s});await load()}catch(e){alert(errText(e))}};
window.createOffer=async()=>{try{await api({action:'create_offer',name:$('#oname').value,code:$('#ocode').value||null,discount_percent:Number($('#odisc').value||0)});await load()}catch(e){alert(errText(e))}};
window.syncCJ=async()=>{setActiveTab('cj');$('#content').innerHTML='<div class="panel"><h3>CJ Sync</h3><p>Syncing CJ Footwear + Kitchen Appliances…</p></div>';try{const d=await api({action:'cj_sync'});alert('CJ sync complete. Imported/updated: '+(d.imported||0)+' | Footwear: '+(d.footwear||0)+' | Kitchen Appliances: '+(d.kitchen||0));await load();}catch(e){$('#content').innerHTML='<div class="notice error">'+esc(errText(e))+'</div>';alert(errText(e))}};
window.syncDeoDap=async()=>{setActiveTab('deodap');$('#content').innerHTML='<div class="panel"><h3>DeoDap Sync</h3><p>Syncing Daily Use Products + Artificial Jewellery…</p></div>';try{const d=await api({action:'deodap_sync'});alert('DeoDap sync complete. Imported/updated: '+(d.imported||0)+' | Daily Use Products: '+(d.daily||0)+' | Artificial Jewellery: '+(d.jewellery||0));await load();}catch(e){$('#content').innerHTML='<div class="notice error">'+esc(errText(e))+'</div>';alert(errText(e))}};
$('#logout').onclick=async()=>{await api({action:'logout'});location.href='/admin.html'};
</script></body></html>
