<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111936">
<title>Nexora-India Admin</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23111936'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Arial' font-size='34' font-weight='900' fill='white'%3EN%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/admin-v2.css?v=20260819-10">
</head>
<body>
<main class="admin-shell">
  <div id="login" class="panel login">
    <h1>Admin Login</h1>
    <p class="muted">Nexora-India operations console</p>
    <form id="loginForm" novalidate>
      <label>Admin password
        <input id="password" class="input" type="password" autocomplete="current-password" required>
      </label>
      <button id="loginBtn" class="btn" type="submit">Login</button>
      <div id="msg" aria-live="polite"></div>
    </form>
  </div>
  <div id="dash" hidden></div>
</main>
<script>
(function(){
  'use strict';

  // admin-v2.js loads ten independent dashboard requests together. Keep one
  // failed secondary request from aborting the entire dashboard boot.
  const nativeAll = Promise.all.bind(Promise);
  Promise.all = function(iterable){
    const items = Array.from(iterable);
    if(items.length !== 10) return nativeAll(items);
    const defaults = [
      {products:0,users:0,orders:0,sales:0},
      [], [], [], [], [], [], [], [], {}
    ];
    return nativeAll(items.map((item,index)=>Promise.resolve(item).then(value=>{
      if(value && typeof value === 'object' && value.error) return defaults[index];
      if(index === 0 && (!value || typeof value !== 'object')) return defaults[index];
      if(index !== 0 && index !== 9 && !Array.isArray(value)) return defaults[index];
      if(index === 9 && (!value || typeof value !== 'object')) return defaults[index];
      return value;
    }).catch(()=>defaults[index])));
  };

  const form = document.getElementById('loginForm');
  const password = document.getElementById('password');
  const button = document.getElementById('loginBtn');
  const msg = document.getElementById('msg');
  if(!form || !password || !button) return;

  let busy = false;
  const esc = value => String(value ?? '').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));

  // admin-v2.js also has a button handler. Stop that handler here so there is
  // exactly one owner of the login flow and no duplicate login/session calls.
  document.addEventListener('click',function(e){
    if(e.target && e.target.closest && e.target.closest('#loginBtn')){
      e.preventDefault();
      e.stopImmediatePropagation();
    }
  },true);

  document.addEventListener('submit',async function(e){
    if(e.target !== form) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    if(busy) return;

    const value = password.value;
    if(!value){
      msg.innerHTML='<div class="notice error">Enter admin password</div>';
      password.focus();
      return;
    }

    busy = true;
    button.disabled = true;
    button.textContent = 'Logging in…';
    msg.innerHTML = '';

    try{
      const r = await fetch('/api/admin',{
        method:'POST',
        credentials:'same-origin',
        cache:'no-store',
        headers:{'content-type':'application/json'},
        body:JSON.stringify({action:'login',password:value})
      });
      const d = await r.json().catch(()=>({error:'Invalid server response'}));
      if(!r.ok || !d.ok) throw new Error(d.error || 'Login failed');

      const s = await fetch('/api/admin',{
        method:'POST',
        credentials:'same-origin',
        cache:'no-store',
        headers:{'content-type':'application/json'},
        body:JSON.stringify({action:'session'})
      });
      const sd = await s.json().catch(()=>({error:'Invalid session response'}));
      if(!s.ok || !sd.ok) throw new Error(sd.error || 'Admin session could not be established');

      // Let the canonical admin-v2 boot run from a clean page load.
      location.reload();
    }catch(err){
      msg.innerHTML='<div class="notice error">'+esc(err.message || err)+'</div>';
      busy = false;
      button.disabled = false;
      button.textContent = 'Login';
      password.focus();
    }
  },true);
})();
</script>
<script src="/admin-v2.js?v=20260819-10"></script>
</body>
</html>
